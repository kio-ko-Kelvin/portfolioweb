{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="{% block description %}Kelvin Kioko | Python & Django Developer{% endblock %}">

    <meta name="author"
          content="Kelvin Kioko">

    <meta name="keywords"
          content="Python, Django, Web Developer, Nairobi, Portfolio">

    <meta name="theme-color"
          content="#111827">

    <title>
        {% block title %}
        {% endblock %}
    </title>

    <link rel="icon"
          href="{{ profile.icon_image.url}}">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="{% static 'portfolioapp/css/style.css' %}">

    {% block extra_css %}

    {% endblock %}

</head>

<body>

<header>

    <nav class="navbar">

        <a href="{% url 'portfolioapp:home' %}"
           class="logo">

            Kelvin<span>.</span>

        </a>

        <ul class="nav-links">

            <li><a href="#home">Home</a></li>

            <li><a href="#about">About</a></li>

            <li><a href="#skills">Skills</a></li>

            <li><a href="#services">Services</a></li>

            <li><a href="#projects">Projects</a></li>

            <li><a href="#contact">Contact</a></li>

        </ul>

        <div class="nav-actions">

            <button
                id="theme-toggle"
                aria-label="Toggle dark mode">

                <i class="fa-solid fa-moon"></i>

            </button>

            <button
                class="menu-btn"
                id="menu-btn">

                <i class="fa-solid fa-bars"></i>

            </button>

        </div>

    </nav>

</header>


<main>

    {% block content %}

    {% endblock %}

</main>

<script src="{% static 'portfolioapp/js/script.js' %}"></script>

{% block extra_js %}

{% endblock %}

</body>
</html>
